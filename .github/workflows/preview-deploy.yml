name: Deploy Preview Channel

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

env:
  NODE_VERSION: '22.20.0'

jobs:
  # Build and deploy to Firebase preview channel
  deploy-preview:
    name: Deploy to Preview Channel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Run type check
        run: npm run type-check
        continue-on-error: true

      - name: Run unit tests
        run: npm test -- --run
        continue-on-error: true

      - name: Build for preview
        run: npm run build
        env:
          # Use staging Firebase config for preview channels
          VITE_FIREBASE_API_KEY: ${{ secrets.STAGING_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.STAGING_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.STAGING_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.STAGING_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.STAGING_FIREBASE_APP_ID }}
          VITE_SENTRY_DSN: ${{ secrets.STAGING_SENTRY_DSN }}
          VITE_SENTRY_ENABLED: false  # Disable Sentry for preview channels
          VITE_APP_VERSION: preview-pr-${{ github.event.pull_request.number }}
          VITE_ENV: preview

      - name: Deploy to Firebase Preview Channel
        id: firebase_preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
          projectId: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
          expires: 7d  # Preview expires after 7 days
          channelId: pr-${{ github.event.pull_request.number }}

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.firebase_preview.outputs.details_url }}';
            const channelUrl = '${{ steps.firebase_preview.outputs.url }}';

            const comment = `## 🔍 Preview Deployment

            **Status**: ✅ Deployed successfully
            **Preview URL**: ${channelUrl}
            **Details**: ${previewUrl}
            **Expires**: 7 days from now

            ### Quick Links
            - 🏠 [Home](${channelUrl})
            - 🔐 [Login](${channelUrl}/login)

            ### Testing Checklist
            - [ ] Login functionality works
            - [ ] Navigation works correctly
            - [ ] Forms are functional
            - [ ] No console errors

            ---
            *Preview channels use the staging Firebase project*
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Update status check
        if: success()
        run: |
          echo "::notice::Preview deployed successfully!"
          echo "::notice::URL: ${{ steps.firebase_preview.outputs.url }}"

      - name: Notify failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## ❌ Preview Deployment Failed

            The preview deployment failed. Please check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.

            Common issues:
            - Build errors (check TypeScript/ESLint)
            - Missing environment variables
            - Firebase permissions
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
